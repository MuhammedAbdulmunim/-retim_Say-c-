<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üretim Takip ve Barkod Sayacı</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            direction: ltr;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 10px;
        }
        video {
            width: 100%;
            max-height: 220px;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-group {
            margin-top: 10px;
            background: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .form-group label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            display: block;
            margin-bottom: 3px;
        }
        .stats {
            margin-top: 12px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
        }
        .stats p {
            margin: 4px 0;
            font-size: 15px;
            color: #2e7d32;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background: #1976d2; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-success { background: #388e3c; color: white; }
        .btn-pdf { background: #e65100; color: white; }
        .btn-undo { background: #f57c00; color: white; }
        
        .action-btn {
            padding: 4px 6px;
            font-size: 11px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin: 1px;
        }
        .btn-edit { background: #ffa000; }
        .btn-del { background: #c62828; }

        table {
            width: 100%;
            margin-top: 12px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
            font-size: 13px;
        }
        th { background-color: #f1f1f1; }
    </style>
</head>
<body>

<div class="container" id="reportArea">
    <h2>Üretim Takip ve Barkod Sayacı</h2>
    
    <div class="form-group">
        <label>Üretim Form No / Parti No:</label>
        <input type="text" id="formNoInput" placeholder="Örn: FRM-2026-001" oninput="saveFormNo()">
    </div>

    <video id="video"></video>
    
    <select id="cameraSelect" style="display:none;"></select>
    <button class="btn btn-primary" onclick="startScanner()">Kamerayı Başlat</button>
    
    <div class="stats">
        <p><strong>Son Okunan Barkod:</strong> <span id="lastCode">-</span></p>
        <p><strong>Ürün Adı:</strong> <span id="productName">-</span></p>
        <p><strong>Bu Ürün Adedi:</strong> <span id="productCount">0</span></p>
    </div>

    <button class="btn btn-undo" onclick="undoLastScan()">↩️ Son Okumayı Geri Al (İptal Et)</button>
    <button class="btn btn-success" onclick="showReport()">Günlük Raporu Göster</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">PDF Rapor İndir / Yazdır</button>
    <button class="btn btn-danger" onclick="resetData()">Sayımları Sıfırla</button>

    <div id="reportSection" style="display:block; margin-top: 15px;">
        <h3>Üretim Raporu</h3>
        <p style="font-size: 12px; color: #666; text-align: center; margin: 2px 0;" id="reportDate"></p>
        <p style="font-size: 12px; color: #666; text-align: center; margin: 2px 0;" id="reportFormNoText"><b>Form No:</b> -</p>
        <table>
            <thead>
                <tr>
                    <th>Barkod</th>
                    <th>Ürün Adı</th>
                    <th>Adet</th>
                    <th class="no-pdf">İşlemler</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- Ürün Listesi -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('production_products')) || {};
    let counts = JSON.parse(localStorage.getItem('production_counts')) || {};
    let lastScannedCode = localStorage.getItem('last_scanned_code') || null; // حفظ آخر باركود للـ Undo
    let lastScanned = "";
    let codeReader = new ZXing.BrowserBarcodeReader();
    let selectedDeviceId = null;

    window.addEventListener('load', function () {
        let savedFormNo = localStorage.getItem('production_form_no') || "";
        document.getElementById('formNoInput').value = savedFormNo;
        updateReportTable();

        codeReader.listVideoInputDevices()
            .then((videoInputDevices) => {
                let sourceSelect = document.getElementById('cameraSelect');
                if (videoInputDevices.length > 0) {
                    sourceSelect.style.display = 'block';
                    selectedDeviceId = videoInputDevices[0].deviceId;
                    
                    videoInputDevices.forEach((element) => {
                        if (element.label.toLowerCase().includes('back') || element.label.toLowerCase().includes('rear') || element.label.toLowerCase().includes('arka')) {
                            selectedDeviceId = element.deviceId;
                        }
                    });

                    sourceSelect.innerHTML = '';
                    videoInputDevices.forEach((element) => {
                        let option = document.createElement('option');
                        option.value = element.deviceId;
                        option.text = element.label || `Kamera ${sourceSelect.length + 1}`;
                        if (element.deviceId === selectedDeviceId) {
                            option.selected = true;
                        }
                        sourceSelect.appendChild(option);
                    });

                    sourceSelect.onchange = () => {
                        selectedDeviceId = sourceSelect.value;
                        startScanner();
                    };
                }
            })
            .catch((err) => { console.error(err); });
    });

    function saveFormNo() {
        let formNo = document.getElementById('formNoInput').value;
        localStorage.setItem('production_form_no', formNo);
        document.getElementById('reportFormNoText').innerHTML = "<b>Form No:</b> " + (formNo || "-");
    }

    function startScanner() {
        codeReader.reset();
        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
            if (result) {
                let code = result.text;
                if (code !== lastScanned) {
                    lastScanned = code;
                    handleScannedCode(code);
                    setTimeout(() => { lastScanned = ""; }, 3000);
                }
            }
        }).catch(err => {
            console.error(err);
            alert("Kamera başlatılamadı. Lütfen tarayıcı izinlerini kontrol edin.");
        });
    }

    function handleScannedCode(code) {
        document.getElementById('lastCode').innerText = code;
        
        if (!products[code]) {
            let pName = prompt("Bu barkod yeni! Lütfen ürün adını ve açıklamasını girin:", "Yeni Ürün");
            if (pName) {
                products[code] = pName;
                counts[code] = 0;
                localStorage.setItem('production_products', JSON.stringify(products));
            } else {
                return;
            }
        }

        counts[code] = (counts[code] || 0) + 1;
        lastScannedCode = code; // حفظه لتمكين التراجع
        localStorage.setItem('production_counts', JSON.stringify(counts));
        localStorage.setItem('last_scanned_code', lastScannedCode);

        document.getElementById('productName').innerText = products[code];
        document.getElementById('productCount').innerText = counts[code];
        
        updateReportTable();
        playBeep();
    }

    function undoLastScan() {
        if (!lastScannedCode || !counts[lastScannedCode] || counts[lastScannedCode] <= 0) {
            alert("Geri alınacak son işlem bulunamadı!");
            return;
        }

        let pName = products[lastScannedCode];
        if (confirm(`Son okunan "${pName}" ürününden 1 adet düşürülsün mü?`)) {
            counts[lastScannedCode] -= 1;
            if (counts[lastScannedCode] < 0) counts[lastScannedCode] = 0;
            
            localStorage.setItem('production_counts', JSON.stringify(counts));
            
            document.getElementById('productName').innerText = pName;
            document.getElementById('productCount').innerText = counts[lastScannedCode];
            document.getElementById('lastCode').innerText = lastScannedCode + " (İptal edildi)";
            
            updateReportTable();
            alert("Son okuma başarıyla geri alındı.");
            lastScannedCode = null;
            localStorage.removeItem('last_scanned_code');
        }
    }

    function updateReportTable() {
        let tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = "";
        
        // عرض التاريخ والوقت الحالي
        let now = new Date();
        let dateStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});
        document.getElementById('reportDate').innerText = "Tarih ve Saat: " + dateStr;
        
        let formNo = document.getElementById('formNoInput').value;
        document.getElementById('reportFormNoText').innerHTML = "<b>Form No:</b> " + (formNo || "-");

        for (let code in products) {
            let row = `<tr>
                <td>${code}</td>
                <td>${products[code]}</td>
                <td><b>${counts[code] || 0}</b></td>
                <td class="no-pdf">
                    <button class="action-btn btn-edit" onclick="editProduct('${code}')">Düzenle</button>
                    <button class="action-btn btn-del" onclick="deleteProduct('${code}')">Sil</button>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    function editProduct(code) {
        let currentName = products[code];
        let newName = prompt("Ürün adını güncell/düzenle:", currentName);
        if (newName !== null && newName.trim() !== "") {
            products[code] = newName.trim();
            localStorage.setItem('production_products', JSON.stringify(products));
            updateReportTable();
            document.getElementById('productName').innerText = products[code];
        }
    }

    function deleteProduct(code) {
        if (confirm("Bu ürünü ve sayacını silmek istediğinizden emin misiniz?")) {
            delete products[code];
            delete counts[code];
            localStorage.setItem('production_products', JSON.stringify(products));
            localStorage.setItem('production_counts', JSON.stringify(counts));
            updateReportTable();
            document.getElementById('productName').innerText = "-";
            document.getElementById('productCount').innerText = "0";
            document.getElementById('lastCode').innerText = "-";
        }
    }

    function showReport() {
        let section = document.getElementById('reportSection');
        section.style.display = section.style.display === 'none' ? 'block' : 'none';
    }

    function downloadPDF() {
        let videoEl = document.getElementById('video');
        videoEl.style.display = 'none';

        let element = document.getElementById('reportArea');
        let opt = {
            margin:       10,
            filename:     'Uretim_Raporu_' + (document.getElementById('formNoInput').value || 'Form') + '_' + new Date().toISOString().slice(0,10) + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save().then(() => {
            videoEl.style.display = 'block';
        });
    }

    function resetData() {
        if (confirm("Tüm sayaçları sıfırlamak istediğinizden emin misiniz?")) {
            counts = {};
            lastScannedCode = null;
            localStorage.setItem('production_counts', JSON.stringify(counts));
            localStorage.removeItem('last_scanned_code');
            document.getElementById('productCount').innerText = "0";
            document.getElementById('productName').innerText = "-";
            document.getElementById('lastCode').innerText = "-";
            updateReportTable();
            alert("Sayaçlar başarıyla sıfırlandı.");
        }
    }

    function playBeep() {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let val = ctx.createGain();
        osc.connect(val);
        val.connect(ctx.destination);
        osc.frequency.value = 800;
        val.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    }
</script>

</body>
            </html>

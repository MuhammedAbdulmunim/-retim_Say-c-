<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Üretim Takip ve Barkod Sayacı</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            direction: ltr;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            max-height: 250px;
            border-radius: 8px;
            background: #000;
            object-fit: cover;
        }
        select {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .stats {
            margin-top: 15px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
        }
        .stats p {
            margin: 5px 0;
            font-size: 16px;
            color: #2e7d32;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary { background: #1976d2; color: white; }
        .btn-danger { background: #d32f2f; color: white; }
        .btn-success { background: #388e3c; color: white; }
        .btn-pdf { background: #e65100; color: white; }
        
        .action-btn {
            padding: 5px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin: 2px;
        }
        .btn-edit { background: #ffa000; }
        .btn-del { background: #c62828; }

        table {
            width: 100%;
            margin-top: 15px;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: center;
            font-size: 13px;
        }
        th { background-color: #f1f1f1; }
    </style>
</head>
<body>

<div class="container" id="reportArea">
    <h2>Üretim Takip ve Barkod Sayacı</h2>
    
    <video id="video"></video>
    
    <select id="cameraSelect" style="display:none;"></select>
    <button class="btn btn-primary" onclick="startScanner()">Kamerayı Başlat</button>
    
    <div class="stats">
        <p><strong>Son Okunan Barkod:</strong> <span id="lastCode">-</span></p>
        <p><strong>Ürün Adı:</strong> <span id="productName">-</span></p>
        <p><strong>Bu Ürün Adedi:</strong> <span id="productCount">0</span></p>
    </div>

    <button class="btn btn-success" onclick="showReport()">Günlük Raporu Göster</button>
    <button class="btn btn-pdf" onclick="downloadPDF()" style="margin-top: 5px;">PDF Rapor İndir / Yazdır</button>
    <button class="btn btn-danger" onclick="resetData()" style="margin-top: 5px;">Sayımları Sıfırla</button>

    <div id="reportSection" style="display:block; margin-top: 15px;">
        <h3>Günlük Özet Raporu</h3>
        <p style="font-size: 12px; color: #666; text-align: center;" id="reportDate"></p>
        <table>
            <thead>
                <tr>
                    <th>Barkod</th>
                    <th>Ürün Adı</th>
                    <th>Adet</th>
                    <th>İşlemler</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- Ürün Listesi -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let products = JSON.parse(localStorage.getItem('production_products')) || {};
    let counts = JSON.parse(localStorage.getItem('production_counts')) || {};
    let lastScanned = "";
    let codeReader = new ZXing.BrowserBarcodeReader();
    let selectedDeviceId = null;

    window.addEventListener('load', function () {
        updateReportTable();
        codeReader.listVideoInputDevices()
            .then((videoInputDevices) => {
                let sourceSelect = document.getElementById('cameraSelect');
                if (videoInputDevices.length > 0) {
                    sourceSelect.style.display = 'block';
                    selectedDeviceId = videoInputDevices[0].deviceId;
                    
                    videoInputDevices.forEach((element) => {
                        if (element.label.toLowerCase().includes('back') || element.label.toLowerCase().includes('rear') || element.label.toLowerCase().includes('arka')) {
                            selectedDeviceId = element.deviceId;
                        }
                    });

                    sourceSelect.innerHTML = '';
                    videoInputDevices.forEach((element) => {
                        let option = document.createElement('option');
                        option.value = element.deviceId;
                        option.text = element.label || `Kamera ${sourceSelect.length + 1}`;
                        if (element.deviceId === selectedDeviceId) {
                            option.selected = true;
                        }
                        sourceSelect.appendChild(option);
                    });

                    sourceSelect.onchange = () => {
                        selectedDeviceId = sourceSelect.value;
                        startScanner();
                    };
                }
            })
            .catch((err) => { console.error(err); });
    });

    function startScanner() {
        codeReader.reset();
        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
            if (result) {
                let code = result.text;
                if (code !== lastScanned) {
                    lastScanned = code;
                    handleScannedCode(code);
                    setTimeout(() => { lastScanned = ""; }, 3000);
                }
            }
        }).catch(err => {
            console.error(err);
            alert("Kamera başlatılamadı. Lütfen tarayıcı izinlerini kontrol edin.");
        });
    }

    function handleScannedCode(code) {
        document.getElementById('lastCode').innerText = code;
        
        if (!products[code]) {
            let pName = prompt("Bu barkod yeni! Lütfen ürün adını ve açıklamasını girin:", "Yeni Ürün");
            if (pName) {
                products[code] = pName;
                counts[code] = 0;
                localStorage.setItem('production_products', JSON.stringify(products));
            } else {
                return;
            }
        }

        counts[code] = (counts[code] || 0) + 1;
        localStorage.setItem('production_counts', JSON.stringify(counts));

        document.getElementById('productName').innerText = products[code];
        document.getElementById('productCount').innerText = counts[code];
        
        updateReportTable();
        playBeep();
    }

    function updateReportTable() {
        let tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = "";
        let today = new Date().toLocaleDateString('tr-TR');
        document.getElementById('reportDate').innerText = "Tarih: " + today;

        for (let code in products) {
            let row = `<tr>
                <td>${code}</td>
                <td>${products[code]}</td>
                <td><b>${counts[code] || 0}</b></td>
                <td>
                    <button class="action-btn btn-edit" onclick="editProduct('${code}')">Düzenle</button>
                    <button class="action-btn btn-del" onclick="deleteProduct('${code}')">Sil</button>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }

    function editProduct(code) {
        let currentName = products[code];
        let newName = prompt("Ürün adını günحيل/düzenle:", currentName);
        if (newName !== null && newName.trim() !== "") {
            products[code] = newName.trim();
            localStorage.setItem('production_products', JSON.stringify(products));
            updateReportTable();
            document.getElementById('productName').innerText = products[code];
        }
    }

    function deleteProduct(code) {
        if (confirm("Bu ürünü ve sayacını silmek istediğinizden emin misiniz?")) {
            delete products[code];
            delete counts[code];
            localStorage.setItem('production_products', JSON.stringify(products));
            localStorage.setItem('production_counts', JSON.stringify(counts));
            updateReportTable();
            document.getElementById('productName').innerText = "-";
            document.getElementById('productCount').innerText = "0";
            document.getElementById('lastCode').innerText = "-";
        }
    }

    function showReport() {
        let section = document.getElementById('reportSection');
        section.style.display = section.style.display === 'none' ? 'block' : 'none';
    }

    function downloadPDF() {
        let videoEl = document.getElementById('video');
        videoEl.style.display = 'none';

        // إخفاء عمود العمليات مؤقتاً ليكون شكل الـ PDF احترافياً ومرتباً
        let originalTable = document.getElementById('reportTableBody').innerHTML;
        
        // إعادة بناء الجدول بدون عمود العمليات للـ PDF
        let pdfBody = "";
        for (let code in products) {
            pdfBody += `<tr>
                <td>${code}</td>
                <td>${products[code]}</td>
                <td><b>${counts[code] || 0}</b></td>
            </tr>`;
        }
        
        let headerRow = document.querySelector('thead tr');
        let actionTh = headerRow.children[3];
        actionTh.style.display = 'none';
        
        let rows = document.querySelectorAll('#reportTableBody tr');
        rows.forEach(r => r.children[3].style.display = 'none');

        let element = document.getElementById('reportArea');
        let opt = {
            margin:       10,
            filename:     'Uretim_Raporu_' + new Date().toISOString().slice(0,10) + '.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().from(element).set(opt).save().then(() => {
            videoEl.style.display = 'block';
            actionTh.style.display = '';
            updateReportTable(); // إعادة إظهار أزرار التحكم في الشاشة العادية
        });
    }

    function resetData() {
        if (confirm("Tüm sayaçları sıfırlamak istediğinizden emin misiniz?")) {
            counts = {};
            localStorage.setItem('production_counts', JSON.stringify(counts));
            document.getElementById('productCount').innerText = "0";
            document.getElementById('productName').innerText = "-";
            document.getElementById('lastCode').innerText = "-";
            updateReportTable();
            alert("Sayaçlar başarıyla sıfırlandı.");
        }
    }

    function playBeep() {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let val = ctx.createGain();
        osc.connect(val);
        val.connect(ctx.destination);
        osc.frequency.value = 800;
        val.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    }
</script>

</body>
</html>
